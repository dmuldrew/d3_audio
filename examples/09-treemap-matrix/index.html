<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>09. Treemap & Hierarchical Market Sonifier | d3-audio</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="../../dist/d3-audio.js"></script>
  <style>
    :root {
      --bg: #080d19;
      --card: #10182b;
      --accent: #38bdf8;
      --positive: #10b981;
      --negative: #f43f5e;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(56, 189, 248, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem;
      min-height: 100vh;
    }
    .container { max-width: 1150px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    .nav-link { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
    .nav-link:hover { text-decoration: underline; }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .layout-grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1.5rem;
    }

    .treemap-box {
      width: 100%;
      height: 480px;
      background: #040813;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
    }

    svg { width: 100%; height: 100%; }

    .treemap-node {
      cursor: pointer;
      transform-box: fill-box;
      transform-origin: center center;
      transition: filter 0.15s, stroke-width 0.15s;
    }
    .treemap-node:hover {
      filter: brightness(1.25) drop-shadow(0 0 10px rgba(56,189,248,0.5));
    }

    .btn {
      background: var(--accent);
      color: #030712;
      border: none;
      padding: 0.65rem 1.3rem;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-bottom: 0.75rem;
    }
    .btn:hover { background: #7dd3fc; }

    .control-group { margin-bottom: 1.25rem; }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }
    select, input[type="range"] {
      width: 100%;
      background: #080d17;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <a href="../../index.html" class="nav-link">← Back to Overview</a>
        <h1 style="font-size: 1.8rem; margin-top: 0.3rem;">09. Treemap & Hierarchical Market Sonifier</h1>
      </div>
      <div style="display: flex; gap: 0.75rem; align-items: center;">
        <button id="btn-audio-activate" class="btn-enable-audio" style="background: #f59e0b; color: #030712; font-weight: 800; border: none; padding: 0.4rem 0.85rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 0.35rem; transition: background 0.2s;">🔊 Enable Audio</button>
        <span id="market-status" style="font-size: 0.95rem; color: var(--accent); font-family: monospace; font-weight: 700;">Hover or scan tiles</span>
      </div>
    </header>

    <div class="panel">
      <div class="layout-grid">
        <!-- Treemap Canvas -->
        <div class="treemap-box" id="treemap-area"></div>

        <!-- Sidebar Controls -->
        <div>
          <button id="scan-market-btn" class="btn">⚡ Start Market Scanner</button>

          <div class="control-group" style="margin-top: 1.25rem;">
            <label>Sector Harmonic Scale</label>
            <select id="scale-select">
              <option value="pentatonic" selected>Pentatonic Major</option>
              <option value="blues">Blues Scale (Volatile)</option>
              <option value="dorian">Dorian Mode</option>
              <option value="minor">Natural Minor (Bear)</option>
              <option value="insen">Japanese Insen</option>
            </select>
          </div>

          <div class="control-group">
            <label>Tile Rhythmic Movement</label>
            <select id="move-select">
              <option value="flip" selected>3D Flip (Perspective)</option>
              <option value="wiggle">Wiggle (Wobble)</option>
              <option value="pulse">Pulse (Scale Pop)</option>
              <option value="squash">Squash & Stretch</option>
              <option value="glow">Glow (Bloom Flash)</option>
              <option value="bounce">Bounce (Spring Push)</option>
            </select>
          </div>

          <div class="control-group">
            <label>Scan Speed</label>
            <input type="range" id="scan-speed" min="120" max="600" value="240">
          </div>

          <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; font-size: 0.8rem; color: var(--muted); line-height: 1.5;">
            • <strong>Market Cap (Area)</strong> → Gain amplitude & duration.<br>
            • <strong>Sector Category</strong> → Base pitch & octave tier.<br>
            • <strong>Performance (+ / -)</strong> → Major mode (gain) vs Minor/Blues (loss).<br>
            • <strong>Tile Position (X)</strong> → Stereo spatial panning (L ↔ R).
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
  <script src="../enable-audio.js"></script>
</body>
</html>
