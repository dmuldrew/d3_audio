<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12. Particle Flow Field & Generative Swarm | d3-audio</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="../../dist/d3-audio.js"></script>
  <style>
    :root {
      --bg: #050914;
      --card: #0d1527;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(56, 189, 248, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem;
      min-height: 100vh;
    }
    .container { max-width: 1150px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    .nav-link { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
    .nav-link:hover { text-decoration: underline; }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .layout-grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1.5rem;
    }

    .flow-box {
      width: 100%;
      height: 480px;
      background: #02050c;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
      cursor: crosshair;
    }

    svg { width: 100%; height: 100%; }

    .particle {
      transform-box: fill-box;
      transform-origin: center center;
    }

    .vortex-node {
      fill: #f43f5e;
      filter: drop-shadow(0 0 10px #f43f5e);
      cursor: pointer;
    }

    .btn {
      background: var(--accent);
      color: #030712;
      border: none;
      padding: 0.65rem 1.3rem;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-bottom: 0.75rem;
    }
    .btn:hover { background: #7dd3fc; }
    .btn-sec { background: #334155; color: #fff; }
    .btn-sec:hover { background: #475569; }

    .control-group { margin-bottom: 1.25rem; }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }
    select, input[type="range"] {
      width: 100%;
      background: #080d17;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <a href="../../index.html" class="nav-link">← Back to Overview</a>
        <h1 style="font-size: 1.8rem; margin-top: 0.3rem;">12. Particle Flow Field & Generative Swarm</h1>
      </div>
      <div style="display: flex; gap: 0.75rem; align-items: center;">
        <button id="btn-audio-activate" class="btn-enable-audio" style="background: #f59e0b; color: #030712; font-weight: 800; border: none; padding: 0.4rem 0.85rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 0.35rem; transition: background 0.2s;">🔊 Enable Audio</button>
        <span id="swarm-status" style="font-family: monospace; font-size: 0.95rem; color: var(--accent); font-weight: 700;">Click canvas to add vortex</span>
      </div>
    </header>

    <div class="panel">
      <div class="layout-grid">
        <!-- Flow Canvas -->
        <div class="flow-box" id="flow-area"></div>

        <!-- Sidebar Controls -->
        <div>
          <button id="toggle-swarm-btn" class="btn">▶ Start Generative Swarm</button>
          <button id="clear-vortex-btn" class="btn btn-sec">🌀 Reset Attractor Vortices</button>

          <div class="control-group" style="margin-top: 1.25rem;">
            <label>Harmonic Scale Mode</label>
            <select id="scale-select">
              <option value="hirajoshi" selected>Japanese Hirajoshi (Ambient)</option>
              <option value="pentatonic">Pentatonic Major</option>
              <option value="dorian">Dorian Mode</option>
              <option value="wholeTone">Whole Tone Float</option>
              <option value="blues">Blues Scale</option>
            </select>
          </div>

          <div class="control-group">
            <label>Particle Count: <span id="count-val">160</span></label>
            <input type="range" id="particle-count" min="40" max="300" step="20" value="160">
          </div>

          <div class="control-group">
            <label>Vortex Force Strength</label>
            <input type="range" id="vortex-strength" min="1" max="10" value="5">
          </div>

          <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; font-size: 0.8rem; color: var(--muted); line-height: 1.5;">
            • <strong>Vector Velocity</strong> → Pitch frequency & note duration.<br>
            • <strong>Horizontal Position (X)</strong> → Stereo spatial panning.<br>
            • <strong>Click Canvas</strong> → Drops gravity vortex attractors.<br>
            • <strong>Swarm Density</strong> → Generative polyphonic cascades.
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
  <script src="../enable-audio.js"></script>
</body>
</html>
