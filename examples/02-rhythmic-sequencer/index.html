<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02. Rhythmic Motion Matrix Sequencer | d3-audio</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="../../dist/d3-audio.js"></script>
  <style>
    :root {
      --bg: #090e17;
      --card: #131d2e;
      --accent: #38bdf8;
      --accent-kick: #ef4444;
      --accent-snare: #f59e0b;
      --accent-hat: #10b981;
      --accent-bass: #a855f7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(56, 189, 248, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem;
      min-height: 100vh;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    .nav-link { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
    .nav-link:hover { text-decoration: underline; }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .sequencer-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .track-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .track-meta {
      width: 180px;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .track-name { font-weight: 700; font-size: 0.95rem; }
    .track-select {
      background: #090e1a;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.25rem;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    .step-buttons {
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      gap: 0.4rem;
      flex-grow: 1;
    }

    .step-tile {
      aspect-ratio: 1;
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 600;
      color: #64748b;
      user-select: none;
      transform-origin: center center;
      transition: background 0.15s, border-color 0.15s;
    }

    .step-tile.beat-accent {
      border-color: rgba(255,255,255,0.25);
    }

    .step-tile.active {
      color: #fff;
    }

    .step-tile.active.kick { background: var(--accent-kick); border-color: #fca5a5; }
    .step-tile.active.snare { background: var(--accent-snare); border-color: #fde68a; }
    .step-tile.active.hihat { background: var(--accent-hat); border-color: #a7f3d0; }
    .step-tile.active.bass { background: var(--accent-bass); border-color: #e9d5ff; }

    .step-tile.current-step {
      box-shadow: 0 0 14px #ffffff;
    }

    .btn {
      background: var(--accent);
      color: #030712;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn:hover { background: #7dd3fc; }
    .btn-preset { background: #334155; color: #fff; font-size: 0.85rem; padding: 0.4rem 0.8rem; }
    .btn-preset:hover { background: #475569; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <a href="../../index.html" class="nav-link">← Back to Overview</a>
        <h1 style="font-size: 1.8rem; margin-top: 0.3rem;">02. Rhythmic Motion Matrix Sequencer</h1>
      </div>
      <div>
        <button id="play-btn" class="btn">▶ Start Sequencer</button>
      </div>
    </header>

    <div class="panel">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div style="display: flex; gap: 0.5rem; align-items: center;">
          <span style="font-size: 0.85rem; color: var(--muted); font-weight: 600;">PRESETS:</span>
          <button class="btn btn-preset" data-preset="electro">Electro Beat</button>
          <button class="btn btn-preset" data-preset="house">Four on Floor</button>
          <button class="btn btn-preset" data-preset="trap">Trap Groove</button>
          <button class="btn btn-preset" data-preset="glitch">Glitch Poly</button>
          <button class="btn btn-preset" data-preset="clear">Clear All</button>
        </div>

        <div style="display: flex; gap: 1rem; align-items: center;">
          <label style="font-size: 0.85rem; color: var(--muted);">BPM: <span id="bpm-val">128</span></label>
          <input type="range" id="bpm-slider" min="80" max="180" value="128">
        </div>
      </div>

      <!-- Sequencer Grid -->
      <div class="sequencer-grid" id="sequencer-grid">
        <!-- Generated via app.js -->
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
